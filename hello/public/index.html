<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>連接檢查</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #5b6475;
      --ok: #137a3f; --ok-bg: #e5f6ec; --err: #b42318; --err-bg: #fdecea;
      --accent: #2456d6; --accent-text: #ffffff; --border: #d9deea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151d; --card: #1b212c; --text: #e8ecf3; --muted: #9aa4b6;
        --ok: #6fdc9b; --ok-bg: #173226; --err: #ff8a80; --err-bg: #3a1d1b;
        --accent: #6c92ff; --accent-text: #0b1020; --border: #2c3442;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text); padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    .card {
      width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 20px; font-size: 1.5rem; }
    .row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-size: 1.6rem; font-weight: 700; padding: 16px 0; border-bottom: 1px solid var(--border);
    }
    .row:last-of-type { border-bottom: 0; }
    button {
      margin-top: 20px; width: 100%; min-height: 64px; font-size: 1.4rem; font-weight: 700;
      border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-text); cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1.15rem; line-height: 1.6; display: none; white-space: pre-line; }
    #result.ok { display: block; background: var(--ok-bg); color: var(--ok); font-size: 1.6rem; font-weight: 700; text-align: center; }
    #result.err { display: block; background: var(--err-bg); color: var(--err); }
    .muted { color: var(--muted); font-size: .95rem; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Agent 連接懶人包・連線檢查</h1>
    <div class="row"><span>前端：Cloudflare Workers</span><span>✅</span></div>
    <div class="row"><span>資料庫：Cloudflare D1</span><span id="db">⏳</span></div>
    <button id="test" type="button">測試資料庫</button>
    <div id="result" role="status" aria-live="polite"></div>
    <p class="muted">按下按鈕會寫入一筆測試資料到 D1 的 connect_check 資料表，再讀回總筆數。不需要任何金鑰。</p>
  </main>

  <script>
    const btn = document.getElementById('test');
    const out = document.getElementById('result');
    const db = document.getElementById('db');

    function show(ok, msg) {
      out.className = ok ? 'ok' : 'err';
      out.textContent = msg;
      db.textContent = ok ? '✅' : '❌';
    }

    function explain(status, error) {
      const msg = String(error || '');
      if (/no such table|migrations apply/i.test(msg)) {
        return '找不到資料表 connect_check（還沒跑 migrations apply）。
建議：請 Agent 重做 AGENTS.md 第 5 步，不必重新部署。

原始訊息：' + msg;
      }
      if (/綁定 DB|d1_databases|binding/i.test(msg)) {
        return '網站還沒接上 D1 資料庫。
建議：請 Agent 重做 AGENTS.md 第 4 步（d1 create），再重新部署（第 6 步）。

原始訊息：' + msg;
      }
      if (status === 404) {
        return '找不到 /api/check（網站只部署了網頁，Worker 沒有生效）。
建議：請 Agent 在 hello 資料夾內重新執行 npx -y wrangler deploy（第 6 步）。';
      }
      if (status === 429 || /limit|quota|exceeded/i.test(msg)) {
        return '超過 Cloudflare 免費額度。
建議：免費額度每天 UTC 0 點（台灣早上 8 點）重置，稍後再試。

原始訊息：' + msg;
      }
      return '發生錯誤' + (status ? '（HTTP ' + status + '）' : '') + '：' + (msg || '未知錯誤') + '
建議：把這段訊息貼給 Agent。';
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '測試中…';
      try {
        let res;
        try {
          res = await fetch('/api/check', { method: 'POST' });
        } catch (e) {
          show(false, '無法連到網站的 /api/check。
建議：確認網路正常（可改用手機熱點），重新整理再試。');
          return;
        }
        let data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        if (res.ok && data && data.ok) {
          show(true, '✅ 連線成功
（寫入並讀回第 ' + data.count + ' 筆）');
        } else {
          show(false, explain(res.status, data && data.error));
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '測試資料庫';
      }
    });
  </script>
</body>
</html>
